name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  design-references:
    name: Design section references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Code, tests and Web comments cite docs/design/platpulse.md as
      # "design §X.Y" and docs/design/webui.md as "webui.md §X.Y"; every
      # cited section must still exist (issue #260).
      - name: Checker self-test
        run: python3 scripts/check-design-refs.py --self-test

      - name: Check design section references
        run: python3 scripts/check-design-refs.py

      # Diagnostics leave the Agent/Server only through the redacting tracing
      # egress: no bare eprintln!/dbg!, stdout only for CLI results, and log
      # fields from the shared vocabulary (issue #250).
      - name: Check logging discipline
        run: python3 scripts/check-logging.py

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: OpenAPI spec freshness
        run: |
          cargo run -p platpulse-server --quiet -- --print-openapi > docs/openapi/openapi.json
          test -z "$(git status --porcelain -- docs/openapi/openapi.json)" \
            || { echo 'OpenAPI spec is not fresh'; git status --porcelain -- docs/openapi/openapi.json; exit 1; }

  # The Server must behave identically on both Storage Backends (ADR 0013):
  # the same suite runs again against PostgreSQL 15 (the supported minimum)
  # and PostgreSQL 18 (the current release). Every test gets its own database
  # cloned from one migrated template (crates/platpulse-server/src/test_support.rs).
  rust-postgres:
    name: Rust workspace (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: platpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PLATPULSE_TEST_STORAGE: postgres
      PLATPULSE_TEST_POSTGRES_URL: postgres://postgres:platpulse@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pg${{ matrix.postgres }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pg${{ matrix.postgres }}-
            ${{ runner.os }}-cargo-

      - name: Test
        run: cargo test --workspace

  web:
    name: WebUI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platpulse-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platpulse-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Generated API client freshness
        run: |
          npm run generate:api
          test -z "$(git status --porcelain -- src/api/generated)" \
            || { echo 'Generated API client is not fresh'; git status --porcelain -- src/api/generated; exit 1; }

  release-package:
    name: Release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platpulse-web/package-lock.json

      - name: Install WebUI dependencies
        working-directory: platpulse-web
        run: npm ci

      - name: Test release packaging policy
        run: scripts/test-release-packaging.sh

      - name: Build release package
        run: scripts/package-release.sh

      - name: Verify release package layout
        run: |
          scripts/validate-release.sh --root target/release-package/root --kind server
          scripts/validate-release.sh --archive target/platpulse-server-*.tar.gz --kind server
          scripts/validate-release.sh --archive target/release-package/release-set/platpulse-agent-*.tar.gz --kind agent
          (cd target/release-package/release-set && sha256sum -c SHA256SUMS)

  web-e2e:
    name: WebUI e2e (fixed viewports)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platpulse-web
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # The e2e suite boots a real dev-mode platpulse-server
        # (e2e/start-server.sh), so the Server binary must build here.
        run: rustup toolchain install stable --profile minimal

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platpulse-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright projects
        run: npm run e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: platpulse-web/test-results/
          retention-days: 7

  release-candidate-harness:
    name: Release-candidate harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platpulse-web/package-lock.json

      - name: Install WebUI dependencies
        working-directory: platpulse-web
        run: npm ci

      - name: Run release-candidate harness
        id: harness
        run: |
          set +e
          scripts/release-candidate-harness.sh
          status=$?
          if [ "$status" -eq 2 ]; then
            echo "The release-candidate harness is unavailable in this environment; checks are distinguished as UNAVAILABLE."
            exit 0
          fi
          exit "$status"

      - name: Upload release-candidate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-harness-diagnostics
          path: |
            target/release-candidate-runs/
            target/release-candidate-recovery/
          if-no-files-found: ignore
          retention-days: 7
