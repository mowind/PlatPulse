name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every change reaches main through a pull request whose only required check
# is `all-checks-passed` (issue #283). A newer push to the same pull request
# cancels its older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Picks the lanes a pull request needs from the paths it changes
  # (scripts/ci-lanes.py documents the rules). A push to main runs every lane.
  # Path filtering happens here rather than in `on.pull_request.paths`: a
  # workflow skipped that way never reports its required check.
  changes:
    name: Select lanes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.lanes.outputs.rust }}
      rust_postgres: ${{ steps.lanes.outputs.rust_postgres }}
      web: ${{ steps.lanes.outputs.web }}
      e2e: ${{ steps.lanes.outputs.e2e }}
      release_package: ${{ steps.lanes.outputs.release_package }}
      rc_harness: ${{ steps.lanes.outputs.rc_harness }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull_request run checks out the merge commit; its first parent is
          # the base branch tip, so HEAD^1..HEAD is exactly the change.
          fetch-depth: 2

      - name: Lane selector self-test
        run: python3 scripts/ci-lanes.py --self-test

      - name: Select lanes
        id: lanes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            lanes="$(git diff --name-only HEAD^1 HEAD | python3 scripts/ci-lanes.py)"
          else
            lanes="$(python3 scripts/ci-lanes.py --all)"
          fi
          printf '%s\n' "$lanes" >> "$GITHUB_OUTPUT"
          { echo '### Selected lanes'; echo; echo '```'; printf '%s\n' "$lanes"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$lanes"

  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Code, tests and Web comments cite docs/design/platpulse.md as
      # "design §X.Y" and docs/design/webui.md as "webui.md §X.Y"; every
      # cited section must still exist (issue #260).
      - name: Checker self-test
        run: python3 scripts/check-design-refs.py --self-test

      - name: Check design section references
        run: python3 scripts/check-design-refs.py

      # Diagnostics leave the Agent/Server only through the redacting tracing
      # egress: no bare eprintln!/dbg!, stdout only for CLI results, and log
      # fields from the shared vocabulary (issue #250).
      - name: Check logging discipline
        run: python3 scripts/check-logging.py

      # Counts PlatPulse is retiring gradually (issue refs in source comments,
      # unsafe TypeScript casts) may only go down (#285, #288).
      - name: Baseline check self-test
        run: python3 scripts/check-baselines.py --self-test

      - name: Check code-quality baselines
        run: python3 scripts/check-baselines.py

      # Every Markdown document stays readable end to end: 8,000 words for a
      # new one, a shrink-only ceiling for the documents already over it.
      - name: Document budget check self-test
        run: python3 scripts/check-doc-budgets.py --self-test

      - name: Check document budgets
        run: python3 scripts/check-doc-budgets.py

      # docs/visual-migration/ keeps its existing screenshots but must stop
      # growing; new evidence goes to the PR or an Actions artifact (#283).
      # Squash merges make every push to main one commit, so HEAD^1 is the
      # right base for both events.
      - name: Screenshot check self-test
        run: python3 scripts/check-no-new-screenshots.py --self-test

      - name: Check for new screenshots
        run: python3 scripts/check-no-new-screenshots.py --base HEAD^1

  rust:
    name: Rust workspace
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: OpenAPI spec freshness
        run: |
          cargo run -p platpulse-server --quiet -- --print-openapi > docs/openapi/openapi.json
          test -z "$(git status --porcelain -- docs/openapi/openapi.json)" \
            || { echo 'OpenAPI spec is not fresh'; git status --porcelain -- docs/openapi/openapi.json; exit 1; }

  # The Server must behave identically on both Storage Backends (ADR 0013):
  # the same suite runs again against PostgreSQL 15 (the supported minimum)
  # and PostgreSQL 18 (the current release). Every test gets its own database
  # cloned from one migrated template (crates/platpulse-server/src/test_support.rs).
  rust-postgres:
    name: Rust workspace (PostgreSQL ${{ matrix.postgres }})
    needs: changes
    if: needs.changes.outputs.rust_postgres == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: platpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PLATPULSE_TEST_STORAGE: postgres
      PLATPULSE_TEST_POSTGRES_URL: postgres://postgres:platpulse@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pg${{ matrix.postgres }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pg${{ matrix.postgres }}-
            ${{ runner.os }}-cargo-

      - name: Test
        run: cargo test --workspace

  web:
    name: WebUI
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platpulse-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platpulse-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Generated API client freshness
        run: |
          npm run generate:api
          test -z "$(git status --porcelain -- src/api/generated)" \
            || { echo 'Generated API client is not fresh'; git status --porcelain -- src/api/generated; exit 1; }

  release-package:
    name: Release package
    needs: changes
    if: needs.changes.outputs.release_package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platpulse-web/package-lock.json

      - name: Install WebUI dependencies
        working-directory: platpulse-web
        run: npm ci

      - name: Test release packaging policy
        run: scripts/test-release-packaging.sh

      - name: Build release package
        run: scripts/package-release.sh

      - name: Verify release package layout
        run: |
          scripts/validate-release.sh --root target/release-package/root --kind server
          scripts/validate-release.sh --archive target/platpulse-server-*.tar.gz --kind server
          scripts/validate-release.sh --archive target/release-package/release-set/platpulse-agent-*.tar.gz --kind agent
          (cd target/release-package/release-set && sha256sum -c SHA256SUMS)

  # The suite runs every fixed viewport on every pull request, one job per
  # project. Playwright's --shard follows project order, so plain 5-way
  # sharding puts one project in each shard; desktop-1280 runs the acceptance
  # specs the other projects skip (27 min against 12-15 min), so it gets two
  # jobs. Inside a job, playwright.config.ts runs two workers, and each worker
  # boots its own seeded Server on its own port and data directory (#289).
  web-e2e:
    name: WebUI e2e (${{ matrix.project }} ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: phone-360-touch, shard: 1/1 }
          - { project: phone-390-touch, shard: 1/1 }
          - { project: tablet-768-touch, shard: 1/1 }
          - { project: desktop-1280, shard: 1/2 }
          - { project: desktop-1280, shard: 2/2 }
          - { project: desktop-1440, shard: 1/1 }
    defaults:
      run:
        working-directory: platpulse-web
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # The e2e suite boots a real dev-mode platpulse-server
        # (e2e/start-server.sh), so the Server binary must build here.
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: web-e2e

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platpulse-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright projects
        run: npm run e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.project }}-${{ strategy.job-index }}
          path: platpulse-web/test-results/
          retention-days: 7

  release-candidate-harness:
    name: Release-candidate harness
    needs: changes
    if: needs.changes.outputs.rc_harness == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platpulse-web/package-lock.json

      - name: Install WebUI dependencies
        working-directory: platpulse-web
        run: npm ci

      - name: Run release-candidate harness
        id: harness
        run: |
          set +e
          scripts/release-candidate-harness.sh
          status=$?
          if [ "$status" -eq 2 ]; then
            # UNAVAILABLE is not PASS: it does not block the merge, but the
            # run says so in its summary and annotations instead of looking green.
            echo "::warning title=Release-candidate harness UNAVAILABLE::The harness could not run in this environment; its checks are UNAVAILABLE, not passed."
            {
              echo '### Release-candidate harness: UNAVAILABLE'
              echo
              echo 'The harness exited with status 2: this environment cannot run it. Its checks are UNAVAILABLE, not passed.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"

      - name: Upload release-candidate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-harness-diagnostics
          path: |
            target/release-candidate-runs/
            target/release-candidate-recovery/
          if-no-files-found: ignore
          retention-days: 7

  # The single required check for branch protection. A lane the selector
  # skipped counts as passed; a failed or cancelled lane fails this job.
  all-checks-passed:
    name: all-checks-passed
    if: always()
    needs:
      - changes
      - repo-checks
      - rust
      - rust-postgres
      - web
      - release-package
      - web-e2e
      - release-candidate-harness
    runs-on: ubuntu-latest
    steps:
      - name: Require every lane to pass or be deselected
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ "$(printf '%s' "$NEEDS" | jq -r '.changes.result')" != success ]; then
            echo '::error::The lane selector did not succeed, so skipped lanes prove nothing.'
            exit 1
          fi
          bad="$(printf '%s' "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::Lanes failed or were cancelled: $bad"
            exit 1
          fi

  # A failure on main is a post-merge regression: open (or update) the
  # ci-red issue so it is handled instead of left red.
  report-main-failure:
    name: Report main failure
    needs: all-checks-passed
    if: always() && github.event_name == 'push' && needs.all-checks-passed.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Open or update the ci-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/report-ci-red.sh "${{ github.workflow }}"
