<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlatPulse</title>
    <!-- Browser-tab mark. Vite rewrites this relative reference to the hashed
         asset under /assets/. -->
    <link rel="icon" type="image/png" href="../assets/platpulse-mark.png" />
    <!-- Same-origin pre-mount theme script: the Server enforces
         script-src 'self', so this cannot be inline. See public/theme-init.js. -->
    <script src="/theme-init.js"></script>
    <!-- Pre-paint canvas. Must equal Emerald's --background in both themes
         (oklch(1 0 0) and oklch(0.141 0.005 285.823)) or the first paint
         flashes the retired palette. -->
    <style>
      body { background: #ffffff; }
      html.dark body { background: #09090b; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
