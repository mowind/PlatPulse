services:
  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:v7
    restart: unless-stopped
    environment:
      GEOIPUPDATE_ACCOUNT_ID_FILE: /run/secrets/maxmind_account_id
      GEOIPUPDATE_LICENSE_KEY_FILE: /run/secrets/maxmind_license_key
      GEOIPUPDATE_EDITION_IDS: GeoLite2-Country
      GEOIPUPDATE_FREQUENCY: "24"
    secrets:
      - maxmind_account_id
      - maxmind_license_key
    volumes:
      - ./geo:/usr/share/GeoIP:rw

secrets:
  maxmind_account_id:
    file: ./secrets/maxmind-account-id
  maxmind_license_key:
    file: ./secrets/maxmind-license-key
