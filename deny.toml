[advisories]
# `rsa` is lockfile-only behind disabled SQLx features; `cargo tree -i rsa` is empty.
ignore = ["RUSTSEC-2023-0071"]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[sources]
allow-git = ["https://github.com/mowind/alloy"]
