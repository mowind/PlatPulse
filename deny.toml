[advisories]
# `rsa` is lockfile-only behind disabled SQLx features; `cargo tree -i rsa` is empty.
# `paste` is pulled by Alloy's proc-macro dependency graph; no maintained
# compatible Alloy release removes it yet. Keep the advisory visible to the
# separate cargo-audit evidence, but do not fail the dependency policy gate.
# `webpki-roots` 0.26.11 is the same shape: Alloy's WebSocket transport uses
# tokio-tungstenite, every published tokio-tungstenite/tungstenite release
# (through 0.30) requires `webpki-roots ^0.26`, and RUSTSEC-2026-0381 patches
# only the 1.0 line (>= 1.0.10, which this workspace also resolves and keeps
# patched). Removing it needs the Alloy fork to offer native roots; the
# residual risk is recorded in docs/security-review.md.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2024-0436", "RUSTSEC-2026-0381"]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[sources]
allow-git = ["https://github.com/mowind/alloy"]
