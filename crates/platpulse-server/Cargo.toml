[package]
name = "platpulse-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PlatPulse central ingestion, projection, and Web asset server"

[lints]
workspace = true

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
utoipa = { version = "5.5", features = ["axum_extras"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
