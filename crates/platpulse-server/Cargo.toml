[package]
name = "platpulse-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PlatPulse central ingestion, projection, and Web asset server"

[lints]
workspace = true

[dependencies]
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
