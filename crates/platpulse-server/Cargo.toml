[package]
name = "platpulse-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PlatPulse central ingestion, projection, and Web asset server"
exclude = ["test-data/"]

[lints]
workspace = true

[features]
# Exposes the shared test-database helper (`platpulse_server::test_support`)
# to this crate's integration tests. Never enabled by a production build.
test-support = ["dep:tempfile"]

[dependencies]
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
hmac = "0.12"
ipnet = "2"
platpulse-core = { path = "../platpulse-core" }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
maxminddb = "0.30"
sqlx = { version = "0.8.6", default-features = false, features = ["any", "sqlite", "runtime-tokio", "macros", "migrate"] }
subtle = "2"
tempfile = { version = "3", optional = true }
thiserror = "2"
time = { version = "=0.3.47", default-features = false, features = ["std", "parsing", "formatting", "macros"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream = "0.1"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry", "env-filter"] }
url = "2"
tower-http = { version = "0.7", features = ["fs", "set-header"] }
utoipa = { version = "5.5", features = ["axum_extras"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["user", "fs"] }

[dev-dependencies]
platpulse-server = { path = ".", features = ["test-support"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
