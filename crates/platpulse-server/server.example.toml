# PlatPulse Server configuration example
# Copy to /etc/platpulse/server.toml and adjust paths for the installation.

state_dir = "/var/lib/platpulse"
db_path = "/var/lib/platpulse/platpulse.db"
backup_dir = "/var/backups/platpulse"
pepper_file = "/etc/platpulse/secrets/server-pepper"

# Optional: omit to use /usr/share/platpulse/web from the release bundle.
# web_root = "/usr/share/platpulse/web"

listen = "127.0.0.1:8080"
public_base_url = "https://monitor.example.com"
development = false

# Optional Storage Backend (ADR 0013). The default is the SQLite database file
# at db_path. PostgreSQL is selected explicitly by name and then db_path must be
# absent; every PostgreSQL setting comes from this section (PG* variables and
# .pgpass are ignored). See docs/deployment.md before switching a deployment.
# [storage]
# backend = "postgres"
# [storage.postgres]
# host = "/run/postgresql"   # or a host name / IP address
# port = 5432
# database = "platpulse"
# user = "platpulse"
# password_file = "/etc/platpulse/secrets/postgres-password"
# sslmode = "disable"        # accepted only over a Unix-domain socket
# connect_timeout_secs = 10
# ownership_heartbeat_secs = 5

# Optional: use an operator-provided GeoLite2 Country database. PlatPulse does
# not download, bundle, or store MaxMind credentials.
# [geo]
# mmdb_path = "/var/lib/platpulse/geo/GeoLite2-Country.mmdb"

# Direct native Rustls HTTPS (production alternative to a trusted proxy).
# Both files are required; the private key must be a same-user-owned 0600
# regular file. Certificates are replaced by a controlled Server restart.
# [tls]
# cert_chain_file = "/etc/platpulse/tls/fullchain.pem"
# private_key_file = "/etc/platpulse/tls/privkey.pem"

# Or keep TLS at an explicitly trusted HTTPS reverse proxy:
# trusted_proxy_cidrs = ["127.0.0.1/32"]
# trusted_proxy_scheme = "https"

# Optional internal Prometheus metrics. The section is disabled when absent;
# when enabled without `listen`, it binds only to 127.0.0.1:9090. The metrics
# listener is separate from the browser/API routes and is never in OpenAPI.
# [metrics]
# enabled = true
# listen = "127.0.0.1:9090"
# Non-loopback metrics uses the same explicit native-TLS or trusted-HTTPS
# proxy policy above; plaintext non-loopback exposure is rejected.

# Optional Server-side PlatScan Validator Provider. The Server is the only
# component that calls PlatScan (per-Validator POST stakingDetails); the
# browser and Agent never contact it. Each registered Network key is bound to
# its own deployment: the detail request carries no Network selector, so a
# shared allowlist cannot establish source chain identity. An unbound Network
# is explicitly not configured, never queried.
# [validator_provider]
# networks = { "platon-mainnet" = "https://scan.platon.network" }
# refresh_seconds = 60
# timeout_seconds = 10
# timezone = "UTC"
