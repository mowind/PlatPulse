# PlatPulse Server configuration example
# Copy to /etc/platpulse/server.toml and adjust paths for the installation.

state_dir = "/var/lib/platpulse"
db_path = "/var/lib/platpulse/platpulse.db"
pepper_file = "/etc/platpulse/secrets/server-pepper"

# Optional: omit to use /usr/share/platpulse/web from the release bundle.
# web_root = "/usr/share/platpulse/web"

listen = "127.0.0.1:8080"
public_base_url = "https://monitor.example.com"
development = false

# Optional: use an operator-provided GeoLite2 Country database. PlatPulse does
# not download, bundle, or store MaxMind credentials.
# [geo]
# mmdb_path = "/var/lib/platpulse/GeoLite2-Country.mmdb"

# Direct native Rustls HTTPS (production alternative to a trusted proxy).
# Both files are required; the private key must be a same-user-owned 0600
# regular file. Certificates are replaced by a controlled Server restart.
# [tls]
# cert_chain_file = "/etc/platpulse/tls/fullchain.pem"
# private_key_file = "/etc/platpulse/tls/privkey.pem"

# Or keep TLS at an explicitly trusted HTTPS reverse proxy:
# trusted_proxy_cidrs = ["10.0.0.0/8"]
# trusted_proxy_scheme = "https"

# Optional internal Prometheus metrics. The section is disabled when absent;
# when enabled without `listen`, it binds only to 127.0.0.1:9090. The metrics
# listener is separate from the browser/API routes and is never in OpenAPI.
# [metrics]
# enabled = true
# listen = "127.0.0.1:9090"
# Non-loopback metrics uses the same explicit native-TLS or trusted-HTTPS
# proxy policy above; plaintext non-loopback exposure is rejected.
