[package]
name = "platpulse-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "I/O-free shared wire protocol types for PlatPulse"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
time = { version = "=0.3.47", default-features = false, features = ["std", "parsing", "formatting", "macros"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
