[package]
name = "platpulse-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PlatPulse collector process that monitors PlatON nodes on one Host"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
platpulse-core = { path = "../platpulse-core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
alloy = { git = "https://github.com/mowind/alloy", rev = "51d20673f7ce1dafe6f4aaad304347b0315dc526", features = ["provider-ws", "provider-ipc", "pubsub", "provider-debug-api"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
sysinfo = "0.30"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
thiserror = "2"
time = { version = "=0.3.47", default-features = false, features = ["std", "parsing", "formatting", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
tokio-util = { version = "0.7" }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["user", "fs"] }

[dev-dependencies]
axum = "0.8"
platpulse-server = { path = "../platpulse-server" }
tempfile = "3"
tokio = { version = "1", features = ["net", "test-util"] }
