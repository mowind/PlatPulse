[package]
name = "platpulse-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PlatPulse collector process that monitors PlatON nodes on one Host"

[lints]
workspace = true

[dependencies]
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
