# PlatPulse Agent example configuration
server_url = "https://monitor.example.com"
credential_file = "/var/lib/platpulse-agent/credential"
state_db = "/var/lib/platpulse-agent/agent.db"
# Recovery point-query bounds (defaults: 256 heights, 128 blocks, 5000 ms)
# Allowed ranges: height span 1..=1000000, block count 1..=100000, time 1..=60000 ms.
[backfill]
max_height_span = 256
max_block_count = 128
max_time_ms = 5000

# [[nodes]]
# node_id = "0195f2a1-0014-4014-8014-000000000014"
# network_key = "platon-mainnet"
# rpc_endpoint = "wss://node.example.com/ws"
#
# Optional explicit Node process selector. Without one the process component
# stays Disabled while RPC/chain collection continues. Exactly one form:
#
# [nodes.process]
# kind = "systemd_unit"
# unit = "platon-validator.service"
#
# [nodes.process]
# kind = "pid_file"
# path = "/run/platon-validator.pid"
#
# A supervisord-managed program, resolved with `supervisorctl pid <program>`.
# Use the group:process form when the program declares numprocs > 1.
# The Agent runtime user must be allowed to run supervisorctl and reach the
# supervisor control socket.
#
# [nodes.process]
# kind = "supervisor"
# program = "platon-validator"
